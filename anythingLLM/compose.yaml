services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    hostname: anythingllm

    restart: unless-stopped

    ports:
      - "3001:3001"

    cap_add:
      - SYS_ADMIN

    environment:
      - TZ=Europe/Rome

      # DStorage Dir
      - STORAGE_DIR=/app/server/storage

      # GGenerate a key JWT
      # openssl rand -hex 32
      - JWT_SECRET=COLOQUE_AQUI_UMA_CHAVE_GRANDE_E_ALEATORIA

      # LLM
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://ollama:11434
      - OLLAMA_MODEL_PREF=llama3.2:3b
      - OLLAMA_MODEL_TOKEN_LIMIT=4096

      # Embeddings
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_BASE_PATH=http://ollama:11434
      - EMBEDDING_MODEL_PREF=nomic-embed-text:latest
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=8192

      # Vectorial database
      - VECTOR_DB=lancedb
      # qdrant
      #- VECTOR_DB=qdrant
      #- QDRANT_URL=http://qdrant:6333
      #- QDRANT_API_KEY=

      # Áudio
      - WHISPER_PROVIDER=local
      - TTS_PROVIDER=native

      # Segurança
      - PASSWORDMINCHAR=8

    volumes:
      - anythingllm_data:/app/server/storage

    networks:
      - homelab

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anythingllm.rule=Host(`llm.seudominio.com`)"
      - "traefik.http.routers.anythingllm.entrypoints=websecure"
      - "traefik.http.services.anythingllm.loadbalancer.server.port=3001"

volumes:
  anythingllm_data:

networks:
  homelab:
    external: true