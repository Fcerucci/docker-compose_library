services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped

    network_mode: host

    # acess http://IP SERVER:8123

    environment:
      - TZ=Europe/Rome

    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro

    privileged: true