services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    hostname: qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    environment:
      - TZ=Europe/Rome

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - homelab

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.seudominio.com`)"
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"

volumes:
  qdrant_data:

networks:
  homelab:
    external: true